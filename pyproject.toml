[project]
name = "proyecto-1-miaa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "veroserna", email = "veroserna@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
notebook = [
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

[project.scripts]
proyecto-1-miaa = "proyecto_1_miaa:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
